name: Sync final profile images

on:
  push:
    paths:
      - '.github/workflows/sync-final-assets.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Fetch final website branch
        run: git fetch origin final-website:refs/remotes/origin/final-website

      - name: Copy final profile images
        run: |
          mkdir -p assets
          git checkout origin/final-website -- assets/page-01.jpg assets/page-02.jpg assets/page-03.jpg assets/page-04.jpg

      - name: Commit images to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/page-01.jpg assets/page-02.jpg assets/page-03.jpg assets/page-04.jpg
          git diff --cached --quiet && exit 0
          git commit -m "Add final AIT profile images"
          git push origin main
